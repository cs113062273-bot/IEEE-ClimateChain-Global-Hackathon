services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      GRIDPROOF_ALLOW_CHAIN_WRITES: "0"
      GRIDPROOF_READ_ONLY: "1"
      GRIDPROOF_STORAGE_PATH: /tmp/gridproof/runs.sqlite3
    ports: ["127.0.0.1:8000:8000"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        GRIDPROOF_API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
