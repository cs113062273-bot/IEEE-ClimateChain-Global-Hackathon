{
  "previews": {"generation": "off"},
  "services": [
    {
      "type": "web",
      "name": "gridproof-api",
      "runtime": "docker",
      "plan": "free",
      "region": "singapore",
      "dockerfilePath": "./Dockerfile.api",
      "dockerContext": ".",
      "autoDeployTrigger": "off",
      "healthCheckPath": "/api/health",
      "envVars": [
        {"key": "GRIDPROOF_READ_ONLY", "value": "1"},
        {"key": "GRIDPROOF_ALLOW_CHAIN_WRITES", "value": "0"},
        {"key": "GRIDPROOF_CHAIN_NETWORK", "value": "testnet"},
        {"key": "GRIDPROOF_CHAIN_ID", "value": "11155111"},
        {"key": "GRIDPROOF_STORAGE_PATH", "value": "/tmp/gridproof/runs.sqlite3"}
      ]
    },
    {
      "type": "web",
      "name": "gridproof-web",
      "runtime": "docker",
      "plan": "free",
      "region": "singapore",
      "dockerfilePath": "./Dockerfile.web",
      "dockerContext": ".",
      "autoDeployTrigger": "off",
      "healthCheckPath": "/",
      "envVars": [
        {"key": "GRIDPROOF_API_URL", "sync": false}
      ]
    },
    {
      "type": "web",
      "name": "gridproof-recorded-demo",
      "runtime": "static",
      "buildCommand": "test -s offline/index.html",
      "staticPublishPath": "./offline",
      "autoDeployTrigger": "off",
      "headers": [
        {"path": "/*", "name": "X-Content-Type-Options", "value": "nosniff"},
        {"path": "/*", "name": "Referrer-Policy", "value": "no-referrer"},
        {"path": "/*", "name": "Cache-Control", "value": "no-cache"}
      ]
    }
  ]
}
